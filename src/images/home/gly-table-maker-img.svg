<svg viewBox="0 -10 480 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="headerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c4a6e"/>
      <stop offset="100%" stop-color="#1f3a58"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="0" y="10" width="480" height="400" rx="10" fill="url(#cardBg)"/>

  <!-- ================= N-glycan (biantennary complex-type, SNFG shapes) ================= -->
  <g stroke="#54606c" stroke-width="1.5">
    <line x1="185" y1="150" x2="185" y2="136"/>
    <line x1="185" y1="129" x2="185" y2="112"/>
    <line x1="185" y1="129" x2="203" y2="140"/>
    <line x1="185" y1="105" x2="185" y2="88"/>
    <line x1="185" y1="88" x2="160" y2="68"/>
    <line x1="185" y1="88" x2="210" y2="68"/>
    <line x1="160" y1="68" x2="140" y2="46"/>
    <line x1="210" y1="68" x2="230" y2="46"/>
    <line x1="140" y1="46" x2="122" y2="26"/>
    <line x1="230" y1="46" x2="248" y2="26"/>
    <line x1="122" y1="26" x2="108" y2="14"/>
    <line x1="248" y1="26" x2="262" y2="14"/>
  </g>

  <!-- reducing-end GlcNAc (square, blue) -->
  <rect x="178" y="136" width="14" height="14" fill="#0072bc" stroke="#1a3a55" stroke-width="1"/>
  <!-- core fucose (triangle, red) -->
  <polygon points="203,133 211,147 195,147" fill="#ed1c24" stroke="#7c1013" stroke-width="1"/>
  <!-- second GlcNAc (square, blue) -->
  <rect x="178" y="105" width="14" height="14" fill="#0072bc" stroke="#1a3a55" stroke-width="1"/>
  <!-- core mannose (circle, green) -->
  <circle cx="185" cy="88" r="9" fill="#00a651" stroke="#0b5c2c" stroke-width="1"/>
  <!-- branch mannoses (circle, green) -->
  <circle cx="160" cy="68" r="9" fill="#00a651" stroke="#0b5c2c" stroke-width="1"/>
  <circle cx="210" cy="68" r="9" fill="#00a651" stroke="#0b5c2c" stroke-width="1"/>
  <!-- antennary GlcNAc (square, blue) -->
  <rect x="133" y="39" width="14" height="14" fill="#0072bc" stroke="#1a3a55" stroke-width="1"/>
  <rect x="223" y="39" width="14" height="14" fill="#0072bc" stroke="#1a3a55" stroke-width="1"/>
  <!-- galactose (circle, yellow) -->
  <circle cx="122" cy="26" r="8" fill="#ffd400" stroke="#8a6c00" stroke-width="1"/>
  <circle cx="248" cy="26" r="8" fill="#ffd400" stroke="#8a6c00" stroke-width="1"/>
  <!-- Neu5Ac sialic acid (diamond, purple) -->
  <polygon points="108,6 116,14 108,22 100,14" fill="#a349a4" stroke="#5c265c" stroke-width="1"/>
  <polygon points="262,6 270,14 262,22 254,14" fill="#a349a4" stroke="#5c265c" stroke-width="1"/>

  <!-- ================= protein sequence ================= -->
  <g font-family="'Courier New', Courier, monospace" font-size="14" fill="#33404d">
    <circle cx="185" cy="165" r="10" fill="#0072bc" opacity="0.16"/>
    <text x="20"  y="170">M</text>
    <text x="35"  y="170">S</text>
    <text x="50"  y="170">T</text>
    <text x="65"  y="170">A</text>
    <text x="80"  y="170">V</text>
    <text x="95"  y="170">L</text>
    <text x="110" y="170">G</text>
    <text x="125" y="170">C</text>
    <text x="140" y="170">L</text>
    <text x="155" y="170">V</text>
    <text x="170" y="170">L</text>
    <text x="185" y="170" font-weight="700" fill="#0f3a5c">N</text>
    <text x="200" y="170">G</text>
    <text x="215" y="170">T</text>
    <text x="230" y="170">L</text>
    <text x="245" y="170">G</text>
    <text x="260" y="170">S</text>
    <text x="275" y="170">V</text>
    <text x="290" y="170">A</text>
    <text x="305" y="170">A</text>
    <text x="320" y="170">G</text>
    <text x="335" y="170">Q</text>
    <text x="350" y="170">K</text>
    <text x="365" y="170">E</text>
    <text x="380" y="170">S</text>
    <text x="395" y="170">P</text>
    <text x="410" y="170">T</text>
    <text x="425" y="170">S</text>
    <text x="440" y="170">A</text>
  </g>
  <line x1="20" y1="176" x2="460" y2="176" stroke="#c3ccd6" stroke-width="1"/>
  <text x="185" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6b7889">Asn104</text>

  <!-- ================= data table ================= -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="20" y="200" width="440" height="158" rx="4" fill="#ffffff" stroke="#c3ccd6" stroke-width="1.2"/>

    <!-- header -->
    <rect x="20" y="200" width="440" height="28" rx="4" fill="url(#headerFill)"/>
    <rect x="20" y="216" width="440" height="12" fill="url(#headerFill)"/>
    <line x1="20" y1="228" x2="460" y2="228" stroke="#0f2136" stroke-width="1.4"/>

    <!-- header column separators -->
    <line x1="130" y1="200" x2="130" y2="228" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="240" y1="200" x2="240" y2="228" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="350" y1="200" x2="350" y2="228" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>

    <!-- header labels -->
    <g font-size="10.5" font-weight="700" fill="#ffffff">
      <text x="28"  y="218">UniProtKB Acc</text>
      <text x="248" y="218">Residue</text>
      <text x="358" y="218">Species</text>
      <text x="138" y="218">GlyTouCan ID</text>
    </g>

    <!-- zebra row shading -->
    <rect x="20" y="228" width="440" height="26" fill="#f3f6fa"/>
    <rect x="20" y="280" width="440" height="26" fill="#f3f6fa"/>
    <rect x="20" y="332" width="440" height="26" fill="#f3f6fa"/>

    <!-- row gridlines -->
    <g stroke="#dde3ea" stroke-width="1">
      <line x1="20" y1="254" x2="460" y2="254"/>
      <line x1="20" y1="280" x2="460" y2="280"/>
      <line x1="20" y1="306" x2="460" y2="306"/>
      <line x1="20" y1="332" x2="460" y2="332"/>
    </g>
    <!-- column gridlines -->
    <g stroke="#e6ebf1" stroke-width="1">
      <line x1="130" y1="228" x2="130" y2="358"/>
      <line x1="240" y1="228" x2="240" y2="358"/>
      <line x1="350" y1="228" x2="350" y2="358"/>
    </g>

    <!-- row data -->
    <g font-size="10.2" fill="#33404d">
      <!-- row 1 -->
      <text x="28" y="245">P12345</text>
      <text x="138" y="245">G17689DH</text>
      <rect x="248" y="238" width="8" height="8" fill="#0072bc" stroke="#1a3a55" stroke-width="0.7"/>
      <text x="261" y="245">Asn104</text>
      <text x="358" y="245">Homo sapiens</text>

      <!-- row 2 -->
      <text x="28" y="271">Q9Y6R7</text>
      <text x="138" y="271">G00023MO</text>
      <rect x="248" y="264" width="8" height="8" fill="#0072bc" stroke="#1a3a55" stroke-width="0.7"/>
      <text x="261" y="271">Asn89</text>
      <text x="358" y="271">Homo sapiens</text>

      <!-- row 3 -->
      <text x="28" y="297">P07766</text>
      <text x="138" y="297">G65412KX</text>
      <rect x="248" y="290" width="8" height="8" fill="#0072bc" stroke="#1a3a55" stroke-width="0.7"/>
      <text x="261" y="297">Asn45</text>
      <text x="358" y="297">Mus musculus</text>

      <!-- row 4 -->
      <text x="28" y="323">O43852</text>
      <text x="138" y="323">G00987VT</text>
      <circle cx="252" cy="319" r="4.3" fill="#ffd400" stroke="#8a6c00" stroke-width="0.7"/>
      <text x="261" y="323">Ser212</text>
      <text x="358" y="323">Homo sapiens</text>

      <!-- row 5 -->
      <text x="28" y="349">P29459</text>
      <text x="138" y="349">G34521QP</text>
      <rect x="248" y="342" width="8" height="8" fill="#0072bc" stroke="#1a3a55" stroke-width="0.7"/>
      <text x="261" y="349">Asn78</text>
      <text x="358" y="349">Rattus norvegicus</text>
    </g>
  </g>
</svg>
